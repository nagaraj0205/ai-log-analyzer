<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Log Analysis</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        header {
            background: #111827;
            padding: 25px 40px;
            border-bottom:
                1px solid #334155;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            background: #020617;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 8px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .secondary {
            background: #475569;
            color: white;
        }

        .loading {
            padding: 20px;
            color: #94a3b8;
        }

        .error {
            background: #450a0a;
            border: 1px solid #991b1b;
            color: #fecaca;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .result {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 25px;
            white-space: pre-wrap;
            line-height: 1.7;
            font-family: Arial, sans-serif;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .label {
            color: #94a3b8;
            font-size: 13px;
        }

    </style>

</head>

<body>

<header>

    <h1>AI Log Analysis</h1>

</header>


<div class="container">

    <div id="error"></div>


    <div class="card">

        <h2>
            Log Input
        </h2>

        <p id="sourceInfo">
            Loading...
        </p>

        <textarea
            id="logs"
            placeholder="Paste logs here..."></textarea>

        <br><br>

        <button
            class="primary"
            onclick="analyzeLogs()">
            Analyze Logs
        </button>

        <button
            class="secondary"
            onclick="window.location.href='/'">
            Back
        </button>

    </div>


    <div id="statistics"></div>


    <div class="card">

        <h2>
            AI Analysis
        </h2>

        <div id="analysis"
             class="result">

            Analysis will appear here.

        </div>

    </div>

</div>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const source =
    params.get("source") || "auto";

const runId =
    params.get("run");

const containerId =
    params.get("container");

const job =
    params.get("job");

const build =
    params.get("build");

const appName =
    params.get("app");

const repo =
    params.get("repo");


const logsTextarea =
    document.getElementById(
        "logs"
    );

const analysisBox =
    document.getElementById(
        "analysis"
    );

const errorBox =
    document.getElementById(
        "error"
    );


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function showError(message) {

    errorBox.innerHTML = `
        <div class="error">
            ${escapeHtml(message)}
        </div>
    `;

}


function clearError() {

    errorBox.innerHTML = "";

}


/* =========================================================
   LOAD SOURCE LOGS
========================================================= */

async function loadLogs() {

    clearError();

    document.getElementById(
        "sourceInfo"
    ).innerHTML = `
        Loading logs from
        <strong>
            ${escapeHtml(source)}
        </strong>
        ...
    `;


    try {

        let url = null;


        /* Docker */

        if (
            source === "docker" &&
            containerId
        ) {

            url =
                `/api/containers/` +
                `${containerId}/logs`;

        }


        /* Jenkins */

        else if (
            source === "jenkins" &&
            job &&
            build
        ) {

            url =
                `/api/jenkins/jobs/` +
                `${job}/builds/` +
                `${build}/logs`;

        }


        /* GitHub Actions */

        else if (
            source === "github-actions" &&
            runId
        ) {

            url =
                `/api/github/runs/` +
                `${runId}/logs` +
                (repo
                    ? `?repo=${encodeURIComponent(repo)}`
                    : "");

        }


        /* Argo CD */

        else if (
            source === "argocd" &&
            appName
        ) {

            url =
                `/api/argocd/applications/` +
                `${appName}`;

        }


        if (!url) {

            document.getElementById(
                "sourceInfo"
            ).innerHTML = `
                Paste your logs below and
                click Analyze Logs.
            `;

            return;

        }


        const response =
            await fetch(url);


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load logs"
            );

        }


        let logs = "";


        /* Docker / Jenkins / GitHub */

        if (data.logs) {

            logs =
                data.logs;

        }


        /* Argo CD */

        else if (
            source === "argocd"
        ) {

            logs =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        }


        logsTextarea.value =
            logs;


        document.getElementById(
            "sourceInfo"
        ).innerHTML = `
            Source:
            <strong>
                ${escapeHtml(source)}
            </strong>
        `;


        updateStatistics(logs);

    }

    catch (error) {

        showError(
            error.message
        );

        document.getElementById(
            "sourceInfo"
        ).innerHTML =
            "Unable to load logs.";

    }

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStatistics(logs) {

    if (!logs) {

        document.getElementById(
            "statistics"
        ).innerHTML = "";

        return;

    }


    const lines =
        logs.split("\n").length;


    const errors =
        (
            logs.match(
                /\b(error|err|failed|failure|fatal)\b/gi
            ) || []
        ).length;


    const warnings =
        (
            logs.match(
                /\b(warn|warning)\b/gi
            ) || []
        ).length;


    const critical =
        (
            logs.match(
                /\b(critical|panic|oom|out of memory)\b/gi
            ) || []
        ).length;


    document.getElementById(
        "statistics"
    ).innerHTML = `

        <div class="stats">

            <div class="stat">

                <div class="label">
                    Lines
                </div>

                <div class="stat-value">
                    ${lines}
                </div>

            </div>


            <div class="stat">

                <div class="label">
                    Errors
                </div>

                <div class="stat-value">
                    ${errors}
                </div>

            </div>


            <div class="stat">

                <div class="label">
                    Warnings
                </div>

                <div class="stat-value">
                    ${warnings}
                </div>

            </div>


            <div class="stat">

                <div class="label">
                    Critical
                </div>

                <div class="stat-value">
                    ${critical}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   ANALYZE
========================================================= */

async function analyzeLogs() {

    clearError();

    const logs =
        logsTextarea.value;


    if (!logs.trim()) {

        showError(
            "Please provide logs."
        );

        return;

    }


    analysisBox.innerHTML = `
        <div class="loading">
            AI is analyzing the logs...
            Please wait.
        </div>
    `;


    updateStatistics(logs);


    try {

        const response =
            await fetch(
                "/api/analyze",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        source:
                            source,

                        logs:
                            logs

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Analysis failed"
            );

        }


        analysisBox.innerHTML =
            escapeHtml(
                data.analysis
            );


    }

    catch (error) {

        analysisBox.innerHTML =
            "Analysis failed.";

        showError(
            error.message
        );

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

loadLogs();

</script>

</body>

</html>
